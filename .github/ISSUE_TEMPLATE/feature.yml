name: Feature request
description: Something new, or a change to how something works
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What you're trying to do, and what you do today instead.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
